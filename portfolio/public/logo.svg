<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Accent gradient from white to medium gray -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#888888" />
    </linearGradient>
    <!-- Border gradient for subtle glowing boundary -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
  </defs>
  <!-- Background Shape: Rounded container -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="rgba(255, 255, 255, 0.03)" stroke="url(#borderGrad)" stroke-width="2" />
  <!-- Monogram paths for H and K -->
  <path d="M 32,30 L 32,70 M 32,50 L 52,50 M 52,30 L 52,70 M 52,50 L 68,30 M 52,50 L 68,70" 
        stroke="url(#logoGrad)" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />
</svg>
